<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 💜</title>
  <style>
    :root {
      --bg: #07040d;
      --panel: #110a1f;
      --accent: #9d4edd;
      --pink: #ff007f;
      --glow: rgba(157, 78, 221, 0.4);
      --border: rgba(157, 78, 221, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    /* Header */
    .header {
      height: 52px;
      padding: 0 16px;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #d8b4fe, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      font-size: 0.72rem;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status::before { content: ""; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    /* Main Viewport Stage */
    .viewport {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    /* Premium Floating Cyber Card */
    .avatar-frame {
      width: 310px;
      height: 420px;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.9), 0 0 30px var(--glow);
      background: #000;
      animation: gentleBreathe 4s infinite ease-in-out;
      transform-origin: center bottom;
    }

    @keyframes gentleBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.018); }
    }

    /* Perfect Centered Portrait Crop (Original Ruchi) */
    .avatar-img {
      position: absolute;
      width: 195%;
      height: auto;
      top: -7%;
      left: -2.5%;
      pointer-events: none;
      filter: contrast(1.05) saturate(1.08) brightness(1.02);
    }

    /* Soft Lighting Overlay */
    .ambient-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(157, 78, 221, 0.08) 0%, transparent 60%, rgba(7, 4, 13, 0.85) 100%);
      pointer-events: none;
    }

    /* Speech Subtitles Box */
    .dialogue-box {
      position: absolute;
      bottom: 14px;
      width: 90%;
      background: rgba(17, 10, 31, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 11px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      line-height: 1.4;
      color: #f3e8ff;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
      z-index: 10;
    }

    /* Bottom Input Dock */
    .footer {
      height: 62px;
      padding: 10px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .footer input {
      flex: 1;
      background: #080410;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 11px 18px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }
    .footer input:focus { border-color: var(--accent); }
    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .btn-mic { background: rgba(157, 78, 221, 0.18); border: 1px solid var(--accent); font-size: 1.2rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 💜</h1>
    <div class="status">ONLINE</div>
  </header>

  <main class="viewport">
    <div class="avatar-frame" id="avatarCard">
      <img class="avatar-img" src="assets/ruchi_sheet.png" alt="Ruchi AI">
      <div class="ambient-sheen"></div>
    </div>

    <div class="dialogue-box" id="dialogueText">
      नमस्कार Ruturaj! मी तुमची रुची आहे. बोला, काय मदत करू? 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic" title="Voice Input">🎙️</button>
    <input type="text" id="userInput" placeholder="रुचीशी बोला (मराठी, हिंदी, English)..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const avatarCard = document.getElementById('avatarCard');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // Natural Voice Engine
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { avatarCard.style.animationDuration = "1.8s"; };
      ut.onend = () => { avatarCard.style.animationDuration = "4s"; };
      ut.onerror = () => { avatarCard.style.animationDuration = "4s"; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator') || q.toLowerCase().includes('koni')) {
        speak("माझे क्रिएटर आणि डेव्हलपर Ruturaj आहेत! 👑💜");
      } else {
        speak(`मी ऐकले: "${q}". मी तुमच्यासोबत आहे!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "मी ऐकतेय, बोला..."; rec.start(); });
    }
  </script>
</body>
</html>
