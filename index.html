<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Global Virtual Companion</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="avatar-mini">🌸</span>
        <div>
          <h2>Ruchi AI</h2>
          <span id="countryTag" class="status-indicator">● Global (Auto-Detect)</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="startCallBtn" class="call-action-btn" title="Full-Body Live Call">📹 Call</button>
      </div>
    </header>

    <!-- Chat Messages -->
    <main class="chat-container" id="chatContainer">
      <div class="msg ruchi-msg">
        Hello! I am Ruchi, created by Ruturaj. Tap the Call button above to see my full 3D animated self, or message me in any country's language! ✨
      </div>
    </main>

    <!-- Bottom Input Controls -->
    <footer class="input-container">
      <button id="voiceChatBtn" class="voice-btn" title="Voice Input">🎙️</button>
      <input type="text" id="userInput" placeholder="Talk with Ruchi in any language..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>
  </div>

  <!-- Full-Screen 3D Full-Body Animated Video Call Screen -->
  <div id="videoCallModal" class="video-call-modal hide">
    <div class="call-overlay-header">
      <div class="call-user-info">
        <h3>Ruchi AI - Live Stage</h3>
        <span id="callStatus" class="call-pulse">Interactive Anime Engine</span>
      </div>
      <button id="endCallBtn" class="end-call-btn" title="Close Stage">✕</button>
    </div>

    <!-- 3D Full-Body Character Display Stage -->
    <div class="anime-stage">
      <div class="full-body-avatar" id="ruchiBody">
        
        <!-- Long Pink & Blue Hair (Back) -->
        <div class="hair-long-back"></div>

        <!-- Upper Body / Head -->
        <div class="head-unit">
          <div class="hair-bangs"></div>
          <div class="face">
            <div class="eye left-eye"><div class="pupil"></div></div>
            <div class="eye right-eye"><div class="pupil"></div></div>
            <div id="tearDrop" class="tear-drop hide"></div>
            <div class="blush b-left"></div>
            <div class="blush b-right"></div>
            <div id="animeMouth" class="mouth neutral"></div>
          </div>
        </div>

        <div class="neck"></div>

        <!-- Torso, Bust & Outfit Structure -->
        <div class="torso">
          <div class="bust-layer">
            <div class="bust-curve left"></div>
            <div class="bust-curve right"></div>
          </div>
          <div class="waist"></div>
        </div>

        <!-- Left & Right Arms and Hands/Fingers -->
        <div class="arm arm-left">
          <div class="forearm">
            <div class="hand">
              <div class="finger f1"></div>
              <div class="finger f2"></div>
              <div class="finger f3"></div>
            </div>
          </div>
        </div>

        <div class="arm arm-right">
          <div class="forearm">
            <div class="hand">
              <div class="finger f1"></div>
              <div class="finger f2"></div>
              <div class="finger f3"></div>
            </div>
          </div>
        </div>

        <!-- Lower Body, Skirt, Legs & Feet -->
        <div class="skirt"></div>
        <div class="legs-container">
          <div class="leg leg-left"><div class="foot"></div></div>
          <div class="leg leg-right"><div class="foot"></div></div>
        </div>

      </div>

      <div id="subtitlesBox" class="subtitles-box">Ready to interact...</div>
    </div>

    <!-- Emotion & Interaction Controls -->
    <div class="call-controls">
      <button id="btnSmile" class="control-circle-btn smile" title="Make Her Laugh/Smile">😄</button>
      <button id="callMicBtn" class="control-circle-btn mic" title="Voice Interaction">🎙️</button>
      <button id="btnCry" class="control-circle-btn sad" title="Sad/Cry Emotion">😢</button>
      <button id="hangupBtn" class="control-circle-btn hangup" title="Hangup">📞</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
