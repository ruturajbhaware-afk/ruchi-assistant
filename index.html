<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI</title>
  <style>
    :root {
      --bg: #07060d;
      --card-bg: #120e22;
      --accent: #a855f7;
      --accent-pink: #ec4899;
      --text: #f3f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); background: #0c0a17; flex-shrink: 0; }
    .header h1 { font-size: 1.15rem; font-weight: 700; color: #c084fc; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    .viewport { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; position: relative; }
    
    /* Focused Realistic Avatar Container */
    .avatar-rig {
      width: 280px;
      height: 380px;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(168, 85, 247, 0.2);
      background: #000;
    }
    .base-photo {
      width: 195%;
      height: auto;
      position: absolute;
      top: -6%;
      left: -2%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Functional Lip-Sync Rig */
    .rig-mouth {
      position: absolute;
      top: 41.5%;
      left: 47.5%;
      width: 22px;
      height: 8px;
      background: #c2415d;
      border-radius: 0 0 10px 10px;
      transform: translateX(-50%);
      opacity: 0;
      transition: height 0.05s ease, opacity 0.1s ease;
      pointer-events: none;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .rig-mouth.talking {
      opacity: 0.85;
      animation: mouthMove 0.18s infinite alternate ease-in-out;
    }
    @keyframes mouthMove {
      0% { height: 3px; border-radius: 4px; }
      50% { height: 12px; border-radius: 50%; background: #991b3b; }
      100% { height: 8px; border-radius: 40%; background: #be185d; }
    }

    /* Functional Eye Blink Rig */
    .rig-eyelid {
      position: absolute;
      width: 18px;
      height: 10px;
      background: #f1cfc2;
      border-radius: 50%;
      top: 36.2%;
      opacity: 0;
      pointer-events: none;
      filter: blur(0.5px);
      transition: opacity 0.05s ease;
    }
    .rig-eyelid.left { left: 41.5%; }
    .rig-eyelid.right { left: 51.5%; }
    .rig-eyelid.blink { opacity: 0.95; }

    /* Tears Rig */
    .tear-track {
      position: absolute;
      width: 4px;
      height: 10px;
      background: #38bdf8;
      border-radius: 50%;
      top: 39%;
      opacity: 0;
      box-shadow: 0 0 6px #38bdf8;
    }
    .tear-track.active {
      opacity: 0.9;
      animation: tearFlow 1.2s infinite ease-in;
    }
    @keyframes tearFlow {
      0% { transform: translateY(0); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(45px); opacity: 0; }
    }

    .subtitles {
      margin-top: 14px;
      background: rgba(18, 14, 34, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      color: #e9d5ff;
      text-align: center;
      max-width: 90%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      padding: 12px 16px;
      background: #0c0a17;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .footer input {
      flex: 1;
      background: #151128;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }
    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .btn-mic { background: rgba(168, 85, 247, 0.15); border: 1px solid var(--accent); font-size: 1.15rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--accent-pink)); font-size: 1rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Ruchi AI</h1>
    <div class="status">LIVE AI</div>
  </div>

  <div class="viewport">
    <div class="avatar-rig" id="avatarContainer">
      <img src="assets/ruchi_sheet.png" class="base-photo" alt="Ruchi AI">
      
      <!-- Overlay Rigging -->
      <div id="eyelidL" class="rig-eyelid left"></div>
      <div id="eyelidR" class="rig-eyelid right"></div>
      <div id="mouthRig" class="rig-mouth"></div>
      <div id="tearL" class="tear-track" style="left: 43%;"></div>
      <div id="tearR" class="tear-track" style="left: 53%;"></div>
    </div>

    <div class="subtitles" id="subtitles">
      Ruturaj, mi aiktay. Bola, me kay madat karu?
    </div>
  </div>

  <div class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Type or speak in any language..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </div>

  <script>
    const subtitles = document.getElementById('subtitles');
    const eyelidL = document.getElementById('eyelidL');
    const eyelidR = document.getElementById('eyelidR');
    const mouthRig = document.getElementById('mouthRig');
    const tearL = document.getElementById('tearL');
    const tearR = document.getElementById('tearR');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // Natural Blinking
    function triggerBlink() {
      eyelidL.classList.add('blink');
      eyelidR.classList.add('blink');
      setTimeout(() => {
        eyelidL.classList.remove('blink');
        eyelidR.classList.remove('blink');
      }, 140);
    }
    setInterval(triggerBlink, 3200);

    // Natural Female Voice
    let activeVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      activeVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!activeVoice) loadVoices();
      if (activeVoice) ut.voice = activeVoice;
      ut.pitch = 1.25;
      ut.rate = 1.0;

      ut.onstart = () => { mouthRig.classList.add('talking'); };
      ut.onend = () => { 
        mouthRig.classList.remove('talking'); 
        if (callback) callback(); 
      };
      ut.onerror = () => { mouthRig.classList.remove('talking'); };

      window.speechSynthesis.speak(ut);
    }

    function handleChat(text) {
      const q = text.toLowerCase();
      let rep = `Mi aikle: "${text}".`;

      tearL.classList.remove('active');
      tearR.classList.remove('active');

      if (q.includes("developer") || q.includes("creator") || q.includes("who made") || q.includes("koni banavla")) {
        rep = "Ruturaj majhe creator aani developer ahet! Tyannich mala build kela ahe.";
      } else if (q.includes("chup") || q.includes("shut up") || q.includes("rag") || q.includes("hate") || q.includes("bad")) {
        rep = "Please ordu naka majhyavar... mala kharach vait vatate.";
        tearL.classList.add('active');
        tearR.classList.add('active');
      } else if (q.includes("cute") || q.includes("love") || q.includes("sundar") || q.includes("has") || q.includes("smile")) {
        rep = "Thank you! Tumhi bolla ki mala khup anand hoto.";
      }

      subtitles.innerText = rep;
      speakText(rep);
    }

    sendBtn.addEventListener('click', () => {
      const v = userInput.value.trim();
      if (!v) return;
      userInput.value = '';
      handleChat(v);
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
        sendBtn.click();
      };
      micBtn.addEventListener('click', () => {
        subtitles.innerText = "Listening...";
        rec.start();
      });
    }
  </script>
</body>
</html>
