<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Pure 3D Autonomous Character 💜</title>
  <style>
    :root {
      --bg: #070510;
      --panel: #110d22;
      --accent: #a855f7;
      --pink: #ec4899;
      --border: rgba(168, 85, 247, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    .header {
      height: 48px;
      padding: 0 16px;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
    .status { font-size: 0.72rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    /* 3D Canvas Stage */
    .viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    .dialogue-box {
      position: absolute;
      bottom: 12px;
      width: 90%;
      background: rgba(18, 12, 34, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.88rem;
      color: #eedaff;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 10;
    }

    .footer {
      height: 60px;
      padding: 10px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .footer input {
      flex: 1;
      background: #080514;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }
    .btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .btn-mic { background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent); font-size: 1.15rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>

  <!-- Clean, Reliable Three.js Core Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 3D 💜</h1>
    <div class="status">SKELETAL 3D RUNNING</div>
  </header>

  <main class="viewport" id="viewport">
    <canvas id="stage3d"></canvas>
    <div class="dialogue-box" id="dialogueText">
      Ruturaj, mi real 3D skeletal body madhe live ahe. Paha maze hath, pay aani sharir swatatah poses badaltayt! 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Ruchi shi bola..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('stage3d');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let isSpeaking = false;

    // 1. Scene, Camera, WebGL Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
    camera.position.set(0, 0.95, 3.4); // Full head-to-toe capture view

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Studio Lighting
    scene.add(new THREE.AmbientLight(0xffbbf0, 0.85));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
    mainLight.position.set(1.5, 3, 2);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x8b5cf6, 1.0);
    rimLight.position.set(-2, 2, -1.5);
    scene.add(rimLight);

    // 2. High-Precision Materials
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffe2d6, roughness: 0.45 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x181024, roughness: 0.35 });
    const topMat = new THREE.MeshStandardMaterial({ color: 0x110c1c, roughness: 0.6 });
    const pantMat = new THREE.MeshStandardMaterial({ color: 0x1a1622, roughness: 0.7 });
    const bootMat = new THREE.MeshStandardMaterial({ color: 0x09070d, roughness: 0.2 });
    const eyeWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eyePupil = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const lipMat = new THREE.MeshStandardMaterial({ color: 0xdb2777, roughness: 0.3 });

    // 3. Complete Skeletal Hierarchy (Head to Toe)
    const ruchiRoot = new THREE.Group();
    scene.add(ruchiRoot);

    // Root Spine & Hips
    const hips = new THREE.Group();
    hips.position.set(0, 0.85, 0);
    ruchiRoot.add(hips);

    // Chest & Upper Torso
    const chestGroup = new THREE.Group();
    chestGroup.position.set(0, 0.3, 0);
    hips.add(chestGroup);

    const chestMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 0.28, 24), topMat);
    chestGroup.add(chestMesh);

    // Bust
    const bustL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), topMat);
    bustL.position.set(-0.075, 0.04, 0.12);
    chestGroup.add(bustL);
    const bustR = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), topMat);
    bustR.position.set(0.075, 0.04, 0.12);
    chestGroup.add(bustR);

    // Neck & Head
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.12, 16), skinMat);
    neck.position.set(0, 0.2, 0);
    chestGroup.add(neck);

    const headGroup = new THREE.Group();
    headGroup.position.set(0, 0.16, 0);
    neck.add(headGroup);

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.20, 32, 32), skinMat);
    headMesh.scale.set(0.95, 1.15, 1.0);
    headGroup.add(headMesh);

    // Hair
    const bangs = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), hairMat);
    bangs.scale.set(1.02, 0.65, 1.05);
    bangs.position.set(0, 0.12, 0.04);
    headGroup.add(bangs);

    const backHair = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.28, 0.75, 20), hairMat);
    backHair.position.set(0, -0.25, -0.12);
    backHair.rotation.x = 0.18;
    headGroup.add(backHair);

    // Eyes with Blinking Eyelids
    function makeEye(x) {
      const g = new THREE.Group();
      const w = new THREE.Mesh(new THREE.SphereGeometry(0.038, 16, 16), eyeWhite);
      w.scale.set(1.1, 1.4, 0.4);
      g.add(w);
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 16), eyePupil);
      p.position.set(0, 0, 0.028);
      g.add(p);
      const lid = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 8), skinMat);
      lid.scale.set(1.2, 0.15, 0.5);
      lid.position.set(0, 0.035, 0.03);
      g.add(lid);
      g.position.set(x, 0.02, 0.18);
      headGroup.add(g);
      return lid;
    }
    const lidL = makeEye(-0.065);
    const lidR = makeEye(0.065);

    // Lips (Talking Mouth)
    const mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.012, 16), lipMat);
    mouth.scale.set(1.2, 0.35, 0.3);
    mouth.position.set(0, -0.10, 0.19);
    headGroup.add(mouth);

    // Arms (Left & Right - Shoulders, Forearms, Hands)
    function makeArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.22, 0.10, 0);
      chestGroup.add(shoulder);

      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.28, 16), topMat);
      upperArm.position.set(0, -0.14, 0);
      shoulder.add(upperArm);

      const elbow = new THREE.Group();
      elbow.position.set(0, -0.28, 0);
      shoulder.add(elbow);

      const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.26, 16), skinMat);
      forearm.position.set(0, -0.13, 0);
      elbow.add(forearm);

      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 12), skinMat);
      hand.scale.set(0.8, 1.2, 0.6);
      hand.position.set(0, -0.28, 0);
      elbow.add(hand);

      return { shoulder, elbow };
    }
    const leftArm = makeArm(-1);
    const rightArm = makeArm(1);

    // Legs (Pelvis, Thighs, Cargo Pants, Boots)
    function makeLeg(side) {
      const hipJoint = new THREE.Group();
      hipJoint.position.set(side * 0.11, -0.05, 0);
      hips.add(hipJoint);

      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.42, 16), pantMat);
      thigh.position.set(0, -0.21, 0);
      hipJoint.add(thigh);

      const knee = new THREE.Group();
      knee.position.set(0, -0.42, 0);
      hipJoint.add(knee);

      const calf = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.06, 0.40, 16), pantMat);
      calf.position.set(0, -0.20, 0);
      knee.add(calf);

      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.12, 0.18), bootMat);
      boot.position.set(0, -0.43, 0.03);
      knee.add(boot);

      return { hipJoint, knee };
    }
    const leftLeg = makeLeg(-1);
    const rightLeg = makeLeg(1);

    // 4. Autonomous Poses Engine (Natural Human Movement Transitions)
    const POSES = {
      idle: {
        hipsRotZ: 0,
        chestRotZ: 0,
        lArmZ: 0.15, lArmX: 0, lElbowX: -0.1,
        rArmZ: -0.15, rArmX: 0, rElbowX: -0.1,
        lLegZ: 0.04, rLegZ: -0.04
      },
      wave: {
        hipsRotZ: -0.04,
        chestRotZ: 0.03,
        lArmZ: 0.2, lArmX: 0, lElbowX: -0.2,
        rArmZ: -1.6, rArmX: 0.2, rElbowX: -0.9, // Hand up in air waving
        lLegZ: 0.06, rLegZ: -0.02
      },
      hipRest: {
        hipsRotZ: 0.08, // Weight on one leg
        chestRotZ: -0.06,
        lArmZ: 0.45, lArmX: 0.1, lElbowX: -0.7, // Hand on waist
        rArmZ: -0.2, rArmX: 0, rElbowX: -0.15,
        lLegZ: -0.08, rLegZ: 0.12
      },
      thinking: {
        hipsRotZ: -0.03,
        chestRotZ: 0.02,
        lArmZ: 0.4, lArmX: 0.2, lElbowX: -1.2, // Hand across waist
        rArmZ: -0.3, rArmX: 0.4, rElbowX: -1.8, // Hand near chin
        lLegZ: 0.02, rLegZ: -0.05
      }
    };

    let activePose = POSES.idle;
    let targetPose = POSES.idle;
    const poseKeys = ['idle', 'wave', 'hipRest', 'thinking'];

    // Bina command cha swatatah poses change karnyacha loop (Every 5 seconds)
    setInterval(() => {
      const randomPose = poseKeys[Math.floor(Math.random() * poseKeys.length)];
      targetPose = POSES[randomPose];
    }, 5500);

    // Command/Function to change pose from outside files:
    window.changeRuchiPose = function(poseName) {
      if (POSES[poseName]) {
        targetPose = POSES[poseName];
      }
    };

    // Smooth Lerp Helper
    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    // 5. Real-Time Render & Animation Loop
    const clock = new THREE.Clock();
    let blinkTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Smooth transition to target pose
      leftArm.shoulder.rotation.z = lerp(leftArm.shoulder.rotation.z, targetPose.lArmZ, 0.05);
      leftArm.shoulder.rotation.x = lerp(leftArm.shoulder.rotation.x, targetPose.lArmX, 0.05);
      leftArm.elbow.rotation.x = lerp(leftArm.elbow.rotation.x, targetPose.lElbowX, 0.05);

      rightArm.shoulder.rotation.z = lerp(rightArm.shoulder.rotation.z, targetPose.rArmZ, 0.05);
      rightArm.shoulder.rotation.x = lerp(rightArm.shoulder.rotation.x, targetPose.rArmX, 0.05);
      rightArm.elbow.rotation.x = lerp(rightArm.elbow.rotation.x, targetPose.rElbowX, 0.05);

      hips.rotation.z = lerp(hips.rotation.z, targetPose.hipsRotZ, 0.05);
      chestGroup.rotation.z = lerp(chestGroup.rotation.z, targetPose.chestRotZ, 0.05);

      leftLeg.hipJoint.rotation.z = lerp(leftLeg.hipJoint.rotation.z, targetPose.lLegZ, 0.05);
      rightLeg.hipJoint.rotation.z = lerp(rightLeg.hipJoint.rotation.z, targetPose.rLegZ, 0.05);

      // Human-like Breathing & Micro-Motion (Chest, shoulders & body weight sway)
      const breath = Math.sin(t * 2.2) * 0.012;
      chestGroup.position.y = 0.3 + breath;
      chestGroup.scale.set(1 + breath * 1.5, 1, 1 + breath * 2);

      // Hand Wave Action (If in wave pose)
      if (targetPose === POSES.wave) {
        rightArm.elbow.rotation.z = Math.sin(t * 8) * 0.3; // Live waving forearm
      }

      // Natural Head & Hair Movement
      headGroup.rotation.y = Math.sin(t * 1.2) * 0.06;
      headGroup.rotation.z = Math.sin(t * 0.9) * 0.03;
      backHair.rotation.z = Math.sin(t * 1.6) * 0.04;

      // Eye Blinking Loop
      blinkTimer += 0.016;
      if (blinkTimer > 3.2) {
        lidL.scale.y = 1.3;
        lidR.scale.y = 1.3;
        if (blinkTimer > 3.36) {
          lidL.scale.y = 0.15;
          lidR.scale.y = 0.15;
          blinkTimer = 0;
        }
      }

      // Live Audio Lip-Sync (Mouth)
      if (isSpeaking) {
        const mouthScale = 0.5 + Math.abs(Math.sin(t * 22)) * 1.6;
        mouth.scale.set(1.2, mouthScale, 0.4);
      } else {
        mouth.scale.set(1.2, 0.35, 0.3);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });

    // Natural Voice Engine
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { isSpeaking = true; };
      ut.onend = () => { isSpeaking = false; };
      ut.onerror = () => { isSpeaking = false; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('wave') || q.toLowerCase().includes('hi') || q.toLowerCase().includes('hello')) {
        window.changeRuchiPose('wave');
        speak("Hey Ruturaj! Paha mi hath varti karun wave karat ahe!");
        return;
      }
      if (q.toLowerCase().includes('think') || q.toLowerCase().includes('vichar')) {
        window.changeRuchiPose('thinking');
        speak("Hmm, mi vichar karat ahe...");
        return;
      }

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator')) {
        speak("Ruturaj majhe creator ahet! Tyannich majhe he 3D skeletal bones banavle ahet 👑💜");
      } else {
        speak(`Mi aikle: "${q}". Maze hath, pay aani body movement paha!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "Mi aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
