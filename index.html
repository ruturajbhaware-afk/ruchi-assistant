<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 💜</title>
  <style>
    :root {
      --bg: #07040d;
      --panel: #110a1f;
      --accent: #9d4edd;
      --pink: #ff007f;
      --border: rgba(157, 78, 221, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    .header {
      height: 50px;
      padding: 0 16px;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #d8b4fe, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      font-size: 0.72rem;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .status::before { content: ""; width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    .viewport {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .avatar-rig {
      width: 310px;
      height: 420px;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.9), 0 0 25px rgba(157, 78, 221, 0.3);
      background: #000;
      animation: chestBreathe 4s infinite ease-in-out;
      transform-origin: center bottom;
    }

    @keyframes chestBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.015); }
    }

    /* Core High-Res Image */
    .avatar-img {
      position: absolute;
      width: 195%;
      height: auto;
      top: -7%;
      left: -2.5%;
      pointer-events: none;
      filter: contrast(1.05) saturate(1.08) brightness(1.02);
    }

    /* Background Cleaner Patch (Removes 'Hey Ruturaj' & 'Your 3D AI Assistant' text) */
    .bg-text-cleaner {
      position: absolute;
      top: 0;
      left: 0;
      width: 38%;
      height: 45%;
      background: radial-gradient(circle at 10% 20%, #150f24 40%, rgba(17, 10, 31, 0.85) 80%, transparent 100%);
      backdrop-filter: blur(12px);
      pointer-events: none;
      z-index: 2;
    }

    /* Active Double Eyelid Blink Engine */
    .eyelid-rig {
      position: absolute;
      width: 25px;
      height: 14px;
      background: #eed8cc;
      border-radius: 50%;
      top: 39.5%;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      filter: blur(0.4px);
      box-shadow: 0 1px 2px rgba(80, 40, 30, 0.4);
      transition: opacity 0.04s ease;
    }
    .eyelid-rig.left { left: 40.8%; transform: rotate(4deg); }
    .eyelid-rig.right { left: 54.2%; transform: rotate(-4deg); }
    .eyelid-rig.blink-active { opacity: 0.95; }

    /* Active Lip-Sync Mouth Rig */
    .mouth-rig {
      position: absolute;
      top: 46.8%;
      left: 48.7%;
      width: 19px;
      height: 5px;
      background: #b84058;
      border-radius: 2px 2px 8px 8px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: height 0.05s ease, opacity 0.1s ease;
    }
    .mouth-rig.is-talking {
      opacity: 0.9;
      animation: mouthTalkCycle 0.15s infinite alternate ease-in-out;
    }
    @keyframes mouthTalkCycle {
      0% { height: 4px; border-radius: 3px; background: #be185d; }
      50% { height: 10px; border-radius: 50%; background: #881337; }
      100% { height: 7px; border-radius: 40%; background: #9d174d; }
    }

    /* Dynamic Hair Physics Strands */
    .hair-sway-left {
      position: absolute;
      top: 36%;
      left: 17%;
      width: 48px;
      height: 180px;
      background: linear-gradient(135deg, rgba(20, 14, 30, 0.75), transparent);
      border-radius: 30% 70% 40% 60%;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
      animation: hairFlowL 3.2s infinite ease-in-out alternate;
      transform-origin: top left;
    }
    .hair-sway-right {
      position: absolute;
      top: 36%;
      right: 17%;
      width: 48px;
      height: 180px;
      background: linear-gradient(225deg, rgba(20, 14, 30, 0.75), transparent);
      border-radius: 70% 30% 60% 40%;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
      animation: hairFlowR 3.6s infinite ease-in-out alternate;
      transform-origin: top right;
    }
    @keyframes hairFlowL {
      0% { transform: rotate(0deg) skewX(0deg); }
      100% { transform: rotate(-2.5deg) skewX(-1.5deg); }
    }
    @keyframes hairFlowR {
      0% { transform: rotate(0deg) skewX(0deg); }
      100% { transform: rotate(2.5deg) skewX(1.5deg); }
    }

    .dialogue-box {
      position: absolute;
      bottom: 14px;
      width: 90%;
      background: rgba(17, 10, 31, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 11px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      line-height: 1.4;
      color: #f3e8ff;
      text-align: center;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
      z-index: 10;
    }

    .footer {
      height: 62px;
      padding: 10px 16px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .footer input {
      flex: 1;
      background: #080410;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 11px 18px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }
    .footer input:focus { border-color: var(--accent); }
    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .btn-mic { background: rgba(157, 78, 221, 0.18); border: 1px solid var(--accent); font-size: 1.2rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 💜</h1>
    <div class="status">ONLINE</div>
  </header>

  <main class="viewport">
    <div class="avatar-rig" id="avatarCard">
      <!-- Main Photo -->
      <img class="avatar-img" src="assets/ruchi_sheet.png" alt="Ruchi AI">
      
      <!-- Text Remover Patch -->
      <div class="bg-text-cleaner"></div>

      <!-- Hair Dynamics -->
      <div class="hair-sway-left"></div>
      <div class="hair-sway-right"></div>

      <!-- Eyelids -->
      <div id="eyeLeft" class="eyelid-rig left"></div>
      <div id="eyeRight" class="eyelid-rig right"></div>

      <!-- Live Lip Sync Mouth -->
      <div id="ruchiMouth" class="mouth-rig"></div>
    </div>

    <div class="dialogue-box" id="dialogueText">
      नमस्कार Ruturaj! आता माझे डोळे, केस आणि ओठ तुमच्या आवाजासोबत सक्रिय आहेत 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic" title="Voice Input">🎙️</button>
    <input type="text" id="userInput" placeholder="रुचीशी बोला (मराठी, हिंदी, English)..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const avatarCard = document.getElementById('avatarCard');
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const ruchiMouth = document.getElementById('ruchiMouth');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // 1. Natural Eye Blinking Logic
    function triggerBlink() {
      eyeLeft.classList.add('blink-active');
      eyeRight.classList.add('blink-active');
      setTimeout(() => {
        eyeLeft.classList.remove('blink-active');
        eyeRight.classList.remove('blink-active');
      }, 150);
    }
    setInterval(triggerBlink, 3400);

    // 2. Speech Engine & Lip-Sync Coordination
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => {
        ruchiMouth.classList.add('is-talking');
        avatarCard.style.animationDuration = "2s";
      };
      ut.onend = () => {
        ruchiMouth.classList.remove('is-talking');
        avatarCard.style.animationDuration = "4s";
      };
      ut.onerror = () => {
        ruchiMouth.classList.remove('is-talking');
        avatarCard.style.animationDuration = "4s";
      };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator') || q.toLowerCase().includes('koni')) {
        speak("माझे क्रिएटर आणि डेव्हलपर Ruturaj आहेत! 👑💜");
      } else {
        speak(`मी ऐकले: "${q}". बघा माझे ओठ, केस आणि डोळे आता रिअल-टाइम हालचाल करत आहेत!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "मी ऐकतेय, बोला..."; rec.start(); });
    }
  </script>
</body>
</html>
