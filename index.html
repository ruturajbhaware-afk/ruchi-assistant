<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Autonomous 3D Avatar 💜</title>
  <style>
    :root {
      --bg: #070510;
      --panel: #110d22;
      --accent: #a855f7;
      --pink: #ec4899;
      --cyan: #38bdf8;
      --border: rgba(168, 85, 247, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Bar */
    .header { height: 50px; padding: 0 16px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    /* Main Live Stage */
    .stage { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 10px; }
    
    /* 3D Breathing Avatar Card */
    .avatar-rig {
      width: 320px;
      height: 420px;
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.35);
      background: radial-gradient(circle at 50% 30%, #1e1338, #070510 95%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: chestBreath 3.6s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes chestBreath {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-7px) scale(1.025, 1.015); }
    }

    /* SVG Character Renderer */
    svg.anime-mesh { width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(0,0,0,0.8)); }

    /* Hair Swaying Animation */
    .hair-sway-left { animation: swayL 3.2s infinite ease-in-out alternate; transform-origin: top center; }
    .hair-sway-right { animation: swayR 3.5s infinite ease-in-out alternate; transform-origin: top center; }
    @keyframes swayL { 0% { transform: rotate(0deg); } 100% { transform: rotate(-2.5deg); } }
    @keyframes swayR { 0% { transform: rotate(0deg); } 100% { transform: rotate(2.5deg); } }

    /* Subtitles */
    .dialogue-box {
      position: absolute;
      bottom: 12px;
      width: 90%;
      background: rgba(18, 12, 34, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.88rem;
      color: #eedaff;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* Footer Dock */
    .footer { height: 60px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 10; }
    .footer input { flex: 1; background: #080514; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; color: #fff; font-size: 0.92rem; outline: none; }
    .btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .btn-mic { background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent); font-size: 1.15rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 3D 💜</h1>
    <div class="status">SELF-BUILT SECURE</div>
  </header>

  <main class="stage">
    <div class="avatar-rig">
      <svg class="anime-mesh" viewBox="0 0 400 520">
        <defs>
          <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#140d24" />
            <stop offset="70%" stop-color="#241445" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
          <linearGradient id="clothGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#151026" />
            <stop offset="100%" stop-color="#090612" />
          </linearGradient>
          <radialGradient id="eyePupil" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="75%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#0f172a" />
          </radialGradient>
        </defs>

        <!-- Back Hair -->
        <path class="hair-sway-left" d="M120,160 Q80,280 110,440 Q160,460 170,300 Z" fill="url(#hairGrad)" />
        <path class="hair-sway-right" d="M280,160 Q320,280 290,440 Q240,460 230,300 Z" fill="url(#hairGrad)" />

        <!-- Torso & Chest (Breathing with Off-shoulder Top) -->
        <path d="M140,320 L120,480 L280,480 L260,320 Z" fill="url(#clothGrad)" />
        <!-- Off-shoulder Neckline & Skin -->
        <path d="M150,300 Q200,325 250,300 L260,340 Q200,360 140,340 Z" fill="#ffe2d6" />
        <!-- Top Logo "Ruchi AI" -->
        <rect x="160" y="375" width="80" height="24" rx="12" fill="#22173d" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="200" y="391" fill="#e9d5ff" font-size="11" font-weight="bold" text-anchor="middle">Ruchi AI 💜</text>

        <!-- Head / Face -->
        <path d="M140,160 Q130,260 200,290 Q270,260 260,160 Q260,110 200,105 Q140,110 140,160 Z" fill="#fff0e8" stroke="#fbcfe8" stroke-width="1" />

        <!-- Cheeks Blush -->
        <ellipse cx="160" cy="225" rx="14" ry="6" fill="#f472b6" opacity="0.45" />
        <ellipse cx="240" cy="225" rx="14" ry="6" fill="#f472b6" opacity="0.45" />

        <!-- Eyes Group -->
        <g id="eyesWrap">
          <!-- Left Eye -->
          <ellipse cx="170" cy="195" rx="15" ry="18" fill="#ffffff" />
          <ellipse cx="170" cy="195" rx="10" ry="14" fill="url(#eyePupil)" />
          <circle cx="166" cy="190" r="3.5" fill="#ffffff" />
          
          <!-- Right Eye -->
          <ellipse cx="230" cy="195" rx="15" ry="18" fill="#ffffff" />
          <ellipse cx="230" cy="195" rx="10" ry="14" fill="url(#eyePupil)" />
          <circle cx="226" cy="190" r="3.5" fill="#ffffff" />

          <!-- Eyelids for Real Blinking -->
          <ellipse id="lidLeft" cx="170" cy="195" rx="16" ry="1" fill="#fed7aa" stroke="#f472b6" stroke-width="2" />
          <ellipse id="lidRight" cx="230" cy="195" rx="16" ry="1" fill="#fed7aa" stroke="#f472b6" stroke-width="2" />
        </g>

        <!-- Dynamic Mouth for Real-time Lip Sync -->
        <path id="animeMouth" d="M192,252 Q200,256 208,252" stroke="#e11d48" stroke-width="3" stroke-linecap="round" fill="none" />

        <!-- Front Hair Bangs -->
        <path d="M135,145 Q200,100 265,145 Q245,190 220,165 Q200,185 180,165 Q155,190 135,145 Z" fill="url(#hairGrad)" />
      </svg>
    </div>

    <div class="dialogue-box" id="dialogueText">
      Ruturaj, apan s स्वतः ha secure 3D avatar code build kela ahe! Paha dole ani lips 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Ruchi shi bola..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const lidLeft = document.getElementById('lidLeft');
    const lidRight = document.getElementById('lidRight');
    const animeMouth = document.getElementById('animeMouth');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let isSpeaking = false;

    // 1. Natural Eye Blinking Logic
    function blink() {
      lidLeft.setAttribute('ry', '18');
      lidRight.setAttribute('ry', '18');
      setTimeout(() => {
        lidLeft.setAttribute('ry', '1');
        lidRight.setAttribute('ry', '1');
      }, 150);
    }
    setInterval(blink, 3400);

    // 2. Real-time Lip-Sync Motion Loop
    let mouthPhase = 0;
    function lipSyncLoop() {
      if (isSpeaking) {
        mouthPhase += 0.35;
        const openY = 252 + Math.abs(Math.sin(mouthPhase)) * 14;
        animeMouth.setAttribute('d', `M188,250 Q200,${openY} 212,250 Q200,248 188,250`);
        animeMouth.setAttribute('fill', '#be185d');
      } else {
        animeMouth.setAttribute('d', 'M192,252 Q200,256 208,252');
        animeMouth.setAttribute('fill', 'none');
      }
      requestAnimationFrame(lipSyncLoop);
    }
    lipSyncLoop();

    // 3. Natural Female Voice Engine
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { isSpeaking = true; };
      ut.onend = () => { isSpeaking = false; };
      ut.onerror = () => { isSpeaking = false; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator') || q.toLowerCase().includes('koni')) {
        speak("Majhe developer aani creator Ruturaj ahet! Tyannich ha custom secure 3D avatar code build kela ahe! 💜");
      } else {
        speak(`Mi aikle: "${q}". Maze dole, lips aani kes bagha, mi live halat ahe!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "Mi aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
