<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="avatar-mini">🌸</span>
        <div>
          <h2>Ruchi AI</h2>
          <span class="status-indicator online">● Online</span>
        </div>
      </div>
      <button id="devModeBtn" class="icon-btn" title="Developer Mode">⚙️</button>
    </header>

    <!-- Character Section -->
    <section class="ruchi-avatar-section">
      <div class="glow-ring">
        <div class="ruchi-avatar" id="ruchiAvatar">
          <span class="expression">😊</span>
        </div>
      </div>
      <p id="ruchiStatusText" class="status-text">मी ऐकतेय, बोला...</p>
    </section>

    <!-- Chat Messages -->
    <main class="chat-container" id="chatContainer">
      <div class="msg ruchi-msg">
        नमस्कार! मी तुमची AI मैत्रीण Ruchi. मी तुम्हाला काय मदत करू? ✨
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="input-container">
      <button id="voiceBtn" class="voice-btn" title="Speak">🎙️</button>
      <input type="text" id="userInput" placeholder="Ruchi शी बोला..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
