<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body { height: 100%; background: #0d1117; color: #f0f6fc; overflow: hidden; }
    .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; }
    .app-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1rem; color: #ff75c3; }
    .ruchi-avatar-section { display: flex; flex-direction: column; align-items: center; padding: 10px 0; flex-shrink: 0; }
    .glow-ring { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #ff75c3, #70a6ff); padding: 3px; }
    .ruchi-avatar { width: 100%; height: 100%; background: #161b22; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; }
    .status-text { font-size: 0.75rem; color: #8b949e; margin-top: 4px; }
    .chat-container { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.4; }
    .ruchi-msg { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }
    .user-msg { align-self: flex-end; background: linear-gradient(135deg, #ff75c3, #70a6ff); color: #fff; border-bottom-right-radius: 2px; }
    .input-container { padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid rgba(255,255,255,0.15); background: #161b22; flex-shrink: 0; }
    .input-container input { flex: 1; background: #0d1117; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 10px 14px; color: #fff; outline: none; font-size: 0.95rem; }
    .send-btn { background: #ff75c3; border: none; border-radius: 50%; width: 40px; height: 40px; color: #fff; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand"><span>🌸</span> Ruchi AI</div>
      <span style="color: #3fb950; font-size: 0.8rem;">● Online</span>
    </header>

    <section class="ruchi-avatar-section">
      <div class="glow-ring">
        <div class="ruchi-avatar" id="ruchiAvatar"><span class="expression">😊</span></div>
      </div>
      <p id="ruchiStatusText" class="status-text">मी ऐकतेय, बोला...</p>
    </section>

    <main class="chat-container" id="chatContainer">
      <div class="msg ruchi-msg">
        नमस्कार! मी तुमची AI मैत्रीण Ruchi. बोला, मी काय मदत करू? ✨
      </div>
    </main>

    <footer class="input-container">
      <input type="text" id="userInput" placeholder="Ruchi शी बोला..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
