<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 💜</title>
  <style>
    :root {
      --bg: #070510;
      --panel: #110d22;
      --accent: #a855f7;
      --pink: #ec4899;
      --border: rgba(168, 85, 247, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    .header {
      height: 48px;
      padding: 0 16px;
      background: var(--panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
    .status { font-size: 0.72rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    .stage {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    /* Single Exact Full Body Viewport */
    .body-viewport {
      width: 220px;
      height: 440px;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.85), 0 0 25px rgba(168, 85, 247, 0.3);
      background: #14101e;
      animation: humanSway 4s infinite ease-in-out;
      transform-origin: bottom center;
    }

    /* Natural human breathing & sway */
    @keyframes humanSway {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      40% { transform: translateY(-6px) scale(1.015, 1.01) rotate(0.4deg); }
      75% { transform: translateY(-2px) scale(1.008, 1.005) rotate(-0.4deg); }
    }

    /* Pixel-accurate zoom on ONLY ONE full body avatar */
    .sprite-img {
      position: absolute;
      width: 1350px;
      height: auto;
      top: -640px;
      left: -980px;
      pointer-events: none;
      filter: contrast(1.05) brightness(1.02);
    }

    .dialogue-box {
      position: absolute;
      bottom: 10px;
      width: 90%;
      background: rgba(18, 12, 34, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.88rem;
      color: #eedaff;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .footer { height: 60px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 10; }
    .footer input { flex: 1; background: #080514; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; color: #fff; font-size: 0.92rem; outline: none; }
    .btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .btn-mic { background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent); font-size: 1.15rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 💜</h1>
    <div class="status">ONLINE</div>
  </header>

  <main class="stage">
    <div class="body-viewport" id="bodyFrame">
      <img class="sprite-img" src="assets/ruchi_sheet.png" alt="Ruchi AI">
    </div>

    <div class="dialogue-box" id="dialogueText">
      Ruturaj, mi aiktay! Full body ready ahe 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Ruchi shi bola..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const bodyFrame = document.getElementById('bodyFrame');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { bodyFrame.style.animationDuration = "1.8s"; };
      ut.onend = () => { bodyFrame.style.animationDuration = "4s"; };
      ut.onerror = () => { bodyFrame.style.animationDuration = "4s"; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator')) {
        speak("Ruturaj majhe creator aani developer ahet! 👑💜");
      } else {
        speak(`Mi aikle: "${q}". Mi tumchya sobat ahe!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "Mi aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
