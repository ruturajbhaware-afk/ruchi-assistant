<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Live 3D Companion</title>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div class="app-layout">
    
    <header class="app-header">
      <div class="brand">
        <h2>Ruchi AI 💜</h2>
        <span class="sub-text">Live Interactive Anime Companion</span>
      </div>
      <div class="status-badge">
        <span class="dot"></span> LIVE MOTION
      </div>
    </header>

    <main class="avatar-stage">
      <div class="canvas-holder">
        <canvas id="liveRuchiCanvas" width="360" height="460"></canvas>
      </div>
      <div class="speech-bubble" id="speechBubble">
        Hey Ruturaj! Mala paha, maje dole blink hotayt, bolatana lips halat ahet! 💜
      </div>
    </main>

    <footer class="footer-control-panel">
      <div class="voice-status">
        <span id="emotionStatusText">Feeling: Active & Responsive</span>
        <div id="voiceWave" class="wave-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="input-row">
        <button id="micBtn" class="action-btn mic-btn">🎙️</button>
        <input type="text" id="userInput" placeholder="Type or speak something to Ruchi..." autocomplete="off">
        <button id="sendBtn" class="action-btn send-btn">➤</button>
      </div>
    </footer>

  </div>

  <script src="js/app.js?v=10"></script>
</body>
</html>
