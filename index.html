<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 3D 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070510; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 10px 16px; background: #0d0a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(168,85,247,0.3); z-index: 10; }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: bold; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: bold; }

    /* 3D WebGL Canvas Stage */
    #canvasContainer { flex: 1; width: 100%; position: relative; background: radial-gradient(circle at 50% 30%, #1e1338, #070510 90%); }
    canvas { width: 100% !important; height: 100% !important; display: block; }

    /* Loading overlay */
    #loadingBox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #070510; color: #c084fc; font-size: 1rem; z-index: 5; font-weight: bold; }

    .dialogue { position: absolute; bottom: 75px; left: 5%; width: 90%; background: rgba(18,12,34,0.88); backdrop-filter: blur(8px); border: 1px solid rgba(168,85,247,0.35); padding: 10px 16px; border-radius: 18px; font-size: 0.88rem; color: #eedaff; text-align: center; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

    .footer { padding: 10px 16px; background: #0d0a1a; border-top: 1px solid rgba(168,85,247,0.3); display: flex; gap: 8px; z-index: 10; }
    .footer input { flex: 1; background: #070510; border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; font-size: 0.9rem; }
    .btn { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 1.1rem; }
    .btn-mic { background: rgba(168,85,247,0.2); }
    .btn-send { background: linear-gradient(135deg, #a855f7, #ec4899); }
  </style>

  <!-- Three.js + GLTFLoader + VRM Library -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.min.js"></script>
</head>
<body>

  <div class="header">
    <h1>Ruchi AI 3D 💜</h1>
    <div class="status">● REAL 3D ENGINE</div>
  </div>

  <div id="canvasContainer">
    <div id="loadingBox">Loading 3D Ruchi Engine...</div>
    <div class="dialogue" id="dialogueText">Ruturaj, mi real 3D avatar madhe load hotey... 💜</div>
  </div>

  <div class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Ask Ruchi anything..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </div>

  <script>
    const container = document.getElementById('canvasContainer');
    const loadingBox = document.getElementById('loadingBox');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let currentVrm = null;
    let isSpeaking = false;

    // Three.js Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, container.clientWidth / container.clientHeight, 0.1, 20);
    camera.position.set(0.0, 1.25, 1.25); // Focus on face and upper chest

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Dynamic Lights
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight.position.set(1.0, 2.0, 1.0).normalize();
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x9333ea, 0.9));

    // Load VRM Model
    const loader = new THREE.GLTFLoader();
    loader.register((parser) => new THREE_VRM.VRMLoaderPlugin(parser));

    loader.load(
      'assets/ruchi.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        vrm.scene.rotation.y = Math.PI; // Face towards camera
        loadingBox.style.display = 'none';
        speak("Namaskar Ruturaj! Mi real 3D Ruchi ahe. Paha maze tond aani dole halat ahet.");
      },
      (progress) => {
        if (progress.total > 0) {
          const p = Math.round((progress.loaded / progress.total) * 100);
          loadingBox.innerText = `Loading 3D Ruchi: ${p}%`;
        } else {
          loadingBox.innerText = `Loading 3D Ruchi Engine...`;
        }
      },
      (error) => {
        loadingBox.innerText = "Error loading 3D VRM file.";
      }
    );

    // Responsive Canvas
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Render Loop & Physics
    const clock = new THREE.Clock();
    let blinkTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (currentVrm) {
        currentVrm.update(delta);

        // Procedural Chest & Spine Breathing Physics
        if (currentVrm.humanoid) {
          const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
          if (chest) {
            chest.rotation.x = Math.sin(time * 2.2) * 0.04;
          }
          const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
          if (spine) {
            spine.rotation.y = Math.sin(time * 0.9) * 0.02;
          }
        }

        // Auto Eye Blink Loop
        blinkTimer += delta;
        if (blinkTimer > 3.4) {
          const blinkVal = Math.sin((blinkTimer - 3.4) * Math.PI * 4);
          if (currentVrm.expressionManager) {
            currentVrm.expressionManager.setValue('blink', Math.max(0, blinkVal));
          }
          if (blinkTimer > 3.65) blinkTimer = 0;
        }

        // Real-Time Lip-Sync
        if (currentVrm.expressionManager) {
          if (isSpeaking) {
            const mouthVal = (Math.sin(time * 20) + 1) * 0.45;
            currentVrm.expressionManager.setValue('aa', mouthVal);
          } else {
            currentVrm.expressionManager.setValue('aa', 0);
          }
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // Natural Female Voice Setup
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => x.name.includes("Female") || x.name.includes("Google") || x.name.includes("Samantha") || x.name.includes("Zira")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { isSpeaking = true; };
      ut.onend = () => { isSpeaking = false; };
      ut.onerror = () => { isSpeaking = false; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    sendBtn.addEventListener('click', () => {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';
      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator')) {
        speak("Ruturaj majhe creator ahet! Tyannich mala 3D banavla ahe 💜");
      } else {
        speak(`Mi aikle: "${q}". Mi tumchya samor real 3D madhe bolat ahe!`);
      }
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; sendBtn.click(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "Aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
