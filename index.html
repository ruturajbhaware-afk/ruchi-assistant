<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #070510; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .header { padding: 12px 16px; background: #120d24; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(139,92,246,0.3); }
    .header h2 { font-size: 1.15rem; color: #c084fc; font-weight: bold; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: bold; }
    
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 10px; }
    .char-card { width: 300px; height: 420px; position: relative; border-radius: 24px; overflow: hidden; border: 1.5px solid rgba(139,92,246,0.4); box-shadow: 0 0 30px rgba(139,92,246,0.35); background: #000; animation: breatheMotion 3.5s infinite ease-in-out; }
    .char-card img { width: 100%; height: 100%; object-fit: cover; }

    /* Breathing & Hair Floating */
    @keyframes breatheMotion {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    /* Real-time Lip sync & Eye blink overlays on top of the HD Photo */
    .eye-blink-bar { position: absolute; top: 34%; left: 38%; width: 28%; height: 5px; background: rgba(20,10,30,0.85); border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity 0.08s; }
    .mouth-sync-bar { position: absolute; top: 41.5%; left: 47%; width: 18px; height: 6px; background: #e11d48; border-radius: 50%; opacity: 0; pointer-events: none; }
    .mouth-sync-bar.talking { opacity: 0.9; animation: lipSyncWave 0.16s infinite alternate; }
    @keyframes lipSyncWave { 0% { transform: scale(0.7, 0.4); } 100% { transform: scale(1.3, 2); } }

    .bubble { margin-top: 12px; background: rgba(20,14,38,0.9); border: 1px solid rgba(139,92,246,0.3); padding: 10px 18px; border-radius: 18px; font-size: 0.88rem; color: #eedaff; text-align: center; max-width: 90%; }
    
    .footer { padding: 10px 16px; background: #120d24; border-top: 1px solid rgba(139,92,246,0.3); display: flex; gap: 8px; }
    .footer input { flex: 1; background: #080512; border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; }
    .footer button { border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; color: #fff; font-size: 1.1rem; }
    .mic-btn { background: rgba(139,92,246,0.2); }
    .send-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
  </style>
</head>
<body>
  <div class="header">
    <h2>Ruchi AI 💜</h2>
    <span class="status">● REAL LIVE AI</span>
  </div>

  <div class="stage">
    <div class="char-card">
      <img src="assets/ruchi_sheet.png" alt="Ruchi HD">
      <div id="eyeBlink" class="eye-blink-bar"></div>
      <div id="mouthSync" class="mouth-sync-bar"></div>
    </div>
    <div id="speechText" class="bubble">Ruturaj, mi aiktay! Paha mi breathing aani live lip-sync karat ahe 💜</div>
  </div>

  <div class="footer">
    <button id="micBtn" class="mic-btn">🎙️</button>
    <input type="text" id="userMsg" placeholder="Talk with Ruchi in any language...">
    <button id="sendBtn" class="send-btn">➤</button>
  </div>

  <script>
    const eyeBlink = document.getElementById('eyeBlink');
    const mouthSync = document.getElementById('mouthSync');
    const speechText = document.getElementById('speechText');
    const userMsg = document.getElementById('userMsg');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // Auto Blinking Loop
    setInterval(() => {
      eyeBlink.style.opacity = '1';
      setTimeout(() => { eyeBlink.style.opacity = '0'; }, 150);
    }, 3200);

    // Natural Voice & Lip-sync
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.pitch = 1.25;
      ut.onstart = () => { mouthSync.classList.add('talking'); };
      ut.onend = () => { mouthSync.classList.remove('talking'); };
      ut.onerror = () => { mouthSync.classList.remove('talking'); };
      window.speechSynthesis.speak(ut);
    }

    function reply(text) {
      speechText.innerText = text;
      speak(text);
    }

    sendBtn.addEventListener('click', () => {
      const q = userMsg.value.trim();
      if (!q) return;
      userMsg.value = '';
      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator')) {
        reply("Ruturaj majhe creator ahet! Tyannich mala he roop dila ahe 💜");
      } else {
        reply(`Mi aikle: "${q}". Mi tumchya pratyek sabdavar dhyan detey!`);
      }
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userMsg.value = e.results[0][0].transcript; sendBtn.click(); };
      micBtn.addEventListener('click', () => { speechText.innerText = "Aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
