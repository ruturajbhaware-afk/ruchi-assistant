<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Live Virtual Companion</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="avatar-mini-circle">🌸</div>
        <div>
          <h2>Ruchi AI</h2>
          <span class="status-indicator">● Active (Natural Engine)</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="startCallBtn" class="call-action-btn">Live Video Call</button>
      </div>
    </header>

    <main class="chat-container" id="chatContainer">
      <div class="msg ruchi-msg">
        Hello Ruturaj! Tap Live Video Call above to see my eyes blink, lips move, and real-time expressions.
      </div>
    </main>

    <footer class="input-container">
      <button id="voiceChatBtn" class="voice-btn" title="Voice Input">🎙️</button>
      <input type="text" id="userInput" placeholder="Speak or type to Ruchi..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>
  </div>

  <!-- Fullscreen Live Interactive Video Call Screen -->
  <div id="videoCallModal" class="video-call-modal hide">
    <div class="call-overlay-header">
      <div class="call-user-info">
        <h3>Ruchi (Live Dynamic)</h3>
        <span class="call-pulse">Live Motion Engine Active</span>
      </div>
      <button id="endCallBtn" class="end-call-btn">✕</button>
    </div>

    <!-- Live Animated Character Viewport -->
    <div class="anime-stage">
      <div class="char-motion-box" id="charBody">
        <!-- Hair Ambient Layer -->
        <div class="anime-hair-bg"></div>

        <!-- Head & Face -->
        <div class="anime-head">
          <div class="anime-bangs"></div>

          <!-- Dynamic Blinking Eyes -->
          <div class="eyes-wrap">
            <div class="eye left-eye">
              <div class="pupil"></div>
              <div class="eye-reflection"></div>
            </div>
            <div class="eye right-eye">
              <div class="pupil"></div>
              <div class="eye-reflection"></div>
            </div>
          </div>

          <!-- Realistic Tears Flow -->
          <div id="tearsWrap" class="tears-layer hide">
            <div class="tear tear-l"></div>
            <div class="tear tear-r"></div>
          </div>

          <!-- Blush -->
          <div class="cheeks c-left"></div>
          <div class="cheeks c-right"></div>

          <!-- Dynamic Moving Lips (Lip-Sync Engine) -->
          <div id="animeLips" class="dynamic-lips neutral">
            <div class="inner-mouth"></div>
          </div>
        </div>

        <!-- Upper Torso & Silhouette -->
        <div class="anime-neck"></div>
        <div class="anime-torso">
          <div class="anime-bust">
            <div class="bust-c left"></div>
            <div class="bust-c right"></div>
          </div>
        </div>
      </div>

      <div id="subtitlesBox" class="subtitles-box">Connecting live feed...</div>
    </div>

    <!-- Call Controls -->
    <div class="call-controls">
      <button id="btnSmile" class="ctrl-btn smile">Happy</button>
      <button id="callMicBtn" class="ctrl-btn mic">🎙️</button>
      <button id="btnCry" class="ctrl-btn sad">Sad</button>
      <button id="hangupBtn" class="ctrl-btn end">End</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
