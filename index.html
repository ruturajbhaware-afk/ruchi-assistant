<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - 3D AI Assistant</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div class="app-layout">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <h2>Ruchi AI 💜</h2>
        <span class="sub-text">Your 3D AI Assistant</span>
      </div>
      <div class="status-badge">
        <span class="dot"></span> ONLINE
      </div>
    </header>

    <!-- Main Character Display -->
    <main class="avatar-display-section">
      <div class="character-card">
        <div class="image-wrapper">
          <img id="mainAvatarImg" src="assets/ruchi_sheet.png" alt="Ruchi AI">
          <div id="mouthOverlay" class="mouth-sync-layer"></div>
        </div>
        <div class="speech-bubble" id="speechBubble">
          Hey Ruturaj! How can I help you today? 💜
        </div>
      </div>
    </main>

    <!-- Expression & Mode Switcher -->
    <section class="expressions-panel">
      <h3>EXPRESSIONS</h3>
      <div class="exp-buttons-grid">
        <button class="exp-btn" onclick="triggerEmotion('happy')">Happy</button>
        <button class="exp-btn" onclick="triggerEmotion('thinking')">Thinking</button>
        <button class="exp-btn" onclick="triggerEmotion('cute')">Cute</button>
        <button class="exp-btn" onclick="triggerEmotion('sad')">Sad</button>
        <button class="exp-btn" onclick="triggerEmotion('surprised')">Surprised</button>
        <button class="exp-btn" onclick="triggerEmotion('laughing')">Laughing</button>
      </div>
    </section>

    <!-- Bottom Controls & Chat -->
    <footer class="footer-control-panel">
      <div class="voice-status">
        <span>Girl Voice (Clone)</span>
        <div id="voiceWave" class="wave-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="input-row">
        <button id="micBtn" class="action-btn mic-btn">🎙️</button>
        <input type="text" id="userInput" placeholder="Talk with Ruchi in any language..." autocomplete="off">
        <button id="sendBtn" class="action-btn send-btn">➤</button>
      </div>
    </footer>

  </div>

  <script src="js/app.js?v=8"></script>
</body>
</html>
