<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI - Virtual Companion</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="header-avatar-thumb">
          <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=150&auto=format&fit=crop&q=80" alt="Ruchi Thumb">
        </div>
        <div>
          <h2>Ruchi AI</h2>
          <span id="countryTag" class="status-indicator">● Active</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="startCallBtn" class="call-action-btn">Live Video Call</button>
      </div>
    </header>

    <!-- Chat Messages Screen -->
    <main class="chat-container" id="chatContainer">
      <div class="msg ruchi-msg">
        Hello Ruturaj. I am Ruchi, your personal AI companion. Tap Live Video Call above to talk with me face-to-face.
      </div>
    </main>

    <!-- Bottom Input -->
    <footer class="input-container">
      <button id="voiceChatBtn" class="voice-btn" title="Speak to Ruchi">🎙️</button>
      <input type="text" id="userInput" placeholder="Say something to Ruchi..." autocomplete="off">
      <button id="sendBtn" class="send-btn">➤</button>
    </footer>
  </div>

  <!-- Fullscreen Realistic Anime Video Call Modal -->
  <div id="videoCallModal" class="video-call-modal hide">
    <div class="call-overlay-header">
      <div class="call-user-info">
        <h3>Ruchi (Live Presence)</h3>
        <span id="callStatus" class="call-pulse">Connected • Natural Voice Engine</span>
      </div>
      <button id="endCallBtn" class="end-call-btn">✕</button>
    </div>

    <!-- 3D Photo/Visual Stage -->
    <div class="anime-stage">
      <div class="character-card-wrapper" id="charWrapper">
        <div class="anime-portrait-frame">
          <img id="ruchiPhoto" class="ruchi-photo" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=600&auto=format&fit=crop&q=85" alt="Ruchi AI">
          
          <!-- Realistic Glowing Emotion Aura -->
          <div class="avatar-glow-overlay"></div>

          <!-- Realistic Tears Overlay -->
          <div id="tearsOverlay" class="tears-container hide">
            <span class="tear tear-1"></span>
            <span class="tear tear-2"></span>
          </div>

          <!-- Lip-Sync Realistic Mouth Overlay -->
          <div id="mouthSync" class="live-mouth neutral"></div>
        </div>
      </div>

      <div id="subtitlesBox" class="subtitles-box">I'm right here with you...</div>
    </div>

    <!-- Video Call Controls -->
    <div class="call-controls">
      <button id="btnSmile" class="control-circle-btn smile-btn" title="Make Her Happy">Happy</button>
      <button id="callMicBtn" class="control-circle-btn mic-btn" title="Voice Talk">🎙️</button>
      <button id="btnCry" class="control-circle-btn cry-btn" title="Tears Emotion">Sad</button>
      <button id="hangupBtn" class="control-circle-btn hangup-btn" title="End">End</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
