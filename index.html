<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 3D 💜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070510; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    .header { padding: 10px 16px; background: #0d0a1a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(168,85,247,0.3); z-index: 10; }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: bold; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: bold; }

    #canvasContainer { flex: 1; width: 100%; position: relative; background: radial-gradient(circle at 50% 30%, #20133a, #070510 90%); }
    canvas { width: 100% !important; height: 100% !important; display: block; }

    #loadingBox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #070510; color: #c084fc; font-size: 1rem; z-index: 5; font-weight: bold; gap: 10px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(168,85,247,0.2); border-top-color: #c084fc; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dialogue { position: absolute; bottom: 75px; left: 5%; width: 90%; background: rgba(18,12,34,0.88); backdrop-filter: blur(8px); border: 1px solid rgba(168,85,247,0.35); padding: 10px 16px; border-radius: 18px; font-size: 0.88rem; color: #eedaff; text-align: center; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

    .footer { padding: 10px 16px; background: #0d0a1a; border-top: 1px solid rgba(168,85,247,0.3); display: flex; gap: 8px; z-index: 10; }
    .footer input { flex: 1; background: #070510; border: 1px solid rgba(168,85,247,0.3); border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; font-size: 0.9rem; }
    .btn { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; color: #fff; font-size: 1.1rem; }
    .btn-mic { background: rgba(168,85,247,0.2); }
    .btn-send { background: linear-gradient(135deg, #a855f7, #ec4899); }
  </style>

  <!-- Modern Import Map for Three.js & VRM -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>

  <div class="header">
    <h1>Ruchi AI 3D 💜</h1>
    <div class="status">● REAL 3D ENGINE</div>
  </div>

  <div id="canvasContainer">
    <div id="loadingBox">
      <div class="spinner"></div>
      <span id="loadText">3D Ruchi लोड होत आहे...</span>
    </div>
    <div class="dialogue" id="dialogueText">नमस्कार Ruturaj! मी 3D मध्ये येत आहे... 💜</div>
  </div>

  <div class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="रुचीशी बोला..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const container = document.getElementById('canvasContainer');
    const loadingBox = document.getElementById('loadingBox');
    const loadText = document.getElementById('loadText');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let currentVrm = null;
    let isSpeaking = false;

    // Three.js Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, container.clientWidth / container.clientHeight, 0.1, 20);
    camera.position.set(0.0, 1.35, 1.15); // Focused framing for head and bust

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // Realistic Lighting
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(1.0, 2.5, 1.5);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x00c8ff, 1.2);
    backLight.position.set(-1.0, 2.0, -1.0);
    scene.add(backLight);

    scene.add(new THREE.AmbientLight(0xffb8eb, 1.2));

    // Loader with VRM Plugin
    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      'assets/ruchi.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);
        VRMUtils.rotateVRM0(vrm);

        currentVrm = vrm;
        scene.add(vrm.scene);

        loadingBox.style.display = 'none';
        speak("नमस्कार Ruturaj! मी तुमची रिअल 3D मैत्रीण रुची आहे. माझे डोळे आणि ओठ तपासा!");
      },
      (progress) => {
        if (progress.total > 0) {
          const pct = Math.round((progress.loaded / progress.total) * 100);
          loadText.innerText = `3D Ruchi लोड होत आहे: ${pct}%`;
        }
      },
      (error) => {
        console.error(error);
        loadText.innerText = "मॉडेल लोड करताना त्रुटी आली. कृपया रिफ्रेश करा.";
      }
    );

    // Responsive Canvas
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // 3D Motion, Breathing & Lip-Sync Loop
    const clock = new THREE.Clock();
    let blinkTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (currentVrm) {
        currentVrm.update(delta);

        // Procedural Chest & Spine Breathing Physics
        if (currentVrm.humanoid) {
          const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
          if (chest) {
            chest.rotation.x = Math.sin(time * 2.2) * 0.035;
          }
          const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
          if (spine) {
            spine.rotation.y = Math.sin(time * 0.9) * 0.015;
          }
          const head = currentVrm.humanoid.getNormalizedBoneNode('head');
          if (head) {
            head.rotation.x = Math.sin(time * 1.5) * 0.02;
            head.rotation.z = Math.sin(time * 1.0) * 0.015;
          }
        }

        // Procedural Eye Blink
        blinkTimer += delta;
        if (blinkTimer > 3.2) {
          const blinkVal = Math.sin((blinkTimer - 3.2) * Math.PI * 4);
          if (currentVrm.expressionManager) {
            currentVrm.expressionManager.setValue('blink', Math.max(0, blinkVal));
          }
          if (blinkTimer > 3.45) blinkTimer = 0;
        }

        // Live Speech Lip-Sync (Mouth Sync)
        if (currentVrm.expressionManager) {
          if (isSpeaking) {
            const mouthVal = (Math.sin(time * 20) + 1) * 0.45;
            currentVrm.expressionManager.setValue('aa', mouthVal);
            currentVrm.expressionManager.setValue('ih', mouthVal * 0.3);
          } else {
            currentVrm.expressionManager.setValue('aa', 0);
            currentVrm.expressionManager.setValue('ih', 0);
          }
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // Natural Voice Engine
    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Google") || x.name.includes("Samantha")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { isSpeaking = true; };
      ut.onend = () => { isSpeaking = false; };
      ut.onerror = () => { isSpeaking = false; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';
      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator') || q.toLowerCase().includes('koni')) {
        speak("माझे क्रिएटर आणि डेव्हलपर Ruturaj आहेत! त्यांनीच मला रिअल 3D मध्ये बनवले आहे! 💜");
      } else {
        speak(`मी ऐकले: "${q}". मी तुमच्यासमोर थेट 3D मध्ये बोलत आहे!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    // Voice Mic
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "मी ऐकतेय, बोला..."; rec.start(); });
    }
  </script>
</body>
</html>
