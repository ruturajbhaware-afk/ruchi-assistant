<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruchi AI 3D 💜</title>
  <style>
    :root {
      --bg: #070510;
      --panel: #110d22;
      --accent: #a855f7;
      --pink: #ec4899;
      --border: rgba(168, 85, 247, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; height: 100dvh; background: var(--bg); color: #fff; overflow: hidden; display: flex; flex-direction: column; }

    .header { height: 50px; padding: 0 16px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; }
    .header h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
    .status { font-size: 0.75rem; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .status::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    .viewport { flex: 1; width: 100%; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #threeCanvas { width: 100%; height: 100%; display: block; }

    .dialogue-box { position: absolute; bottom: 12px; width: 90%; background: rgba(18, 12, 34, 0.88); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 10px 16px; border-radius: 18px; font-size: 0.88rem; color: #eedaff; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10; }

    .footer { height: 60px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 10; }
    .footer input { flex: 1; background: #080514; border: 1px solid var(--border); border-radius: 22px; padding: 10px 16px; color: #fff; font-size: 0.92rem; outline: none; }
    .btn { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .btn-mic { background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent); font-size: 1.15rem; }
    .btn-send { background: linear-gradient(135deg, var(--accent), var(--pink)); font-size: 1rem; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header class="header">
    <h1>Ruchi AI 3D 💜</h1>
    <div class="status">LIVE 3D AVATAR</div>
  </header>

  <main class="viewport" id="viewport">
    <canvas id="threeCanvas"></canvas>
    <div class="dialogue-box" id="dialogueText">
      Namaskar Ruturaj! Mi real 3D engine madhe live ahe. 💜
    </div>
  </main>

  <footer class="footer">
    <button id="micBtn" class="btn btn-mic">🎙️</button>
    <input type="text" id="userInput" placeholder="Ruchi shi bola..." autocomplete="off">
    <button id="sendBtn" class="btn btn-send">➤</button>
  </footer>

  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('threeCanvas');
    const dialogueText = document.getElementById('dialogueText');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    let isSpeaking = false;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
    camera.position.set(0, 1.45, 2.2);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    scene.add(new THREE.AmbientLight(0xffb8eb, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    const avatarGroup = new THREE.Group();
    scene.add(avatarGroup);

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdfd4, roughness: 0.45 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x1b132a, roughness: 0.3 });
    const clothMat = new THREE.MeshStandardMaterial({ color: 0x110e1c, roughness: 0.6 });
    const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const lipsMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.3 });

    const headGeo = new THREE.SphereGeometry(0.24, 32, 32);
    headGeo.scale(1, 1.15, 1.05);
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.set(0, 1.45, 0);
    avatarGroup.add(head);

    const bangsGeo = new THREE.SphereGeometry(0.27, 32, 16);
    bangsGeo.scale(1.05, 0.6, 1.05);
    const bangs = new THREE.Mesh(bangsGeo, hairMat);
    bangs.position.set(0, 1.62, 0.04);
    avatarGroup.add(bangs);

    const hairBackGeo = new THREE.CylinderGeometry(0.15, 0.32, 0.8, 24);
    const hairBack = new THREE.Mesh(hairBackGeo, hairMat);
    hairBack.position.set(0, 1.2, -0.15);
    hairBack.rotation.x = 0.2;
    avatarGroup.add(hairBack);

    function createEye(x) {
      const eyeG = new THREE.Group();
      const white = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), eyeWhiteMat);
      white.scale.set(1.2, 1.5, 0.4);
      eyeG.add(white);

      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 16), pupilMat);
      pupil.position.set(0, 0, 0.035);
      pupil.scale.set(1, 1.3, 0.3);
      eyeG.add(pupil);

      const lid = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 8), skinMat);
      lid.scale.set(1.25, 0.2, 0.5);
      lid.position.set(0, 0.05, 0.038);
      eyeG.add(lid);

      eyeG.position.set(x, 1.48, 0.21);
      avatarGroup.add(eyeG);
      return { lid };
    }
    const eyeL = createEye(-0.08);
    const eyeR = createEye(0.08);

    const mouthGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.015, 16);
    mouthGeo.scale(1.3, 0.4, 0.3);
    const mouth = new THREE.Mesh(mouthGeo, lipsMat);
    mouth.position.set(0, 1.33, 0.23);
    avatarGroup.add(mouth);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.075, 0.14, 16), skinMat);
    neck.position.set(0, 1.28, 0);
    avatarGroup.add(neck);

    const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.3, 24), clothMat);
    chest.position.set(0, 1.1, 0);
    avatarGroup.add(chest);

    const bustL = new THREE.Mesh(new THREE.SphereGeometry(0.085, 20, 20), clothMat);
    bustL.position.set(-0.08, 1.14, 0.12);
    avatarGroup.add(bustL);

    const bustR = new THREE.Mesh(new THREE.SphereGeometry(0.085, 20, 20), clothMat);
    bustR.position.set(0.08, 1.14, 0.12);
    avatarGroup.add(bustR);

    let blinkProgress = 0;
    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const t = clock.getElapsedTime();

      const breath = Math.sin(t * 2.2) * 0.015;
      avatarGroup.position.y = breath;
      chest.scale.set(1 + breath * 1.5, 1, 1 + breath * 2);
      bustL.position.z = 0.12 + breath * 0.8;
      bustR.position.z = 0.12 + breath * 0.8;

      head.rotation.y = Math.sin(t * 1.2) * 0.06;
      head.rotation.z = Math.sin(t * 0.9) * 0.02;
      hairBack.rotation.z = Math.sin(t * 1.5) * 0.04;

      blinkProgress += 0.016;
      if (blinkProgress > 3.2) {
        eyeL.lid.scale.y = 1.2;
        eyeR.lid.scale.y = 1.2;
        if (blinkProgress > 3.35) {
          eyeL.lid.scale.y = 0.2;
          eyeR.lid.scale.y = 0.2;
          blinkProgress = 0;
        }
      }

      if (isSpeaking) {
        const mouthScale = 0.6 + Math.abs(Math.sin(t * 22)) * 1.6;
        mouth.scale.set(1.3, mouthScale, 0.5);
      } else {
        mouth.scale.set(1.3, 0.4, 0.3);
      }

      renderer.render(scene, camera);
    }
    renderLoop();

    window.addEventListener('resize', () => {
      camera.aspect = viewport.clientWidth / viewport.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    });

    let femaleVoice = null;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      femaleVoice = v.find(x => (x.name.includes("Female") || x.name.includes("Samantha") || x.name.includes("Google") || x.name.includes("Zira")) && !x.name.includes("Male")) || v[0];
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      if (!femaleVoice) loadVoices();
      if (femaleVoice) ut.voice = femaleVoice;
      ut.pitch = 1.25;

      ut.onstart = () => { isSpeaking = true; };
      ut.onend = () => { isSpeaking = false; };
      ut.onerror = () => { isSpeaking = false; };

      dialogueText.innerText = text;
      window.speechSynthesis.speak(ut);
    }

    function handleUserInput() {
      const q = userInput.value.trim();
      if (!q) return;
      userInput.value = '';

      if (q.toLowerCase().includes('developer') || q.toLowerCase().includes('creator') || q.toLowerCase().includes('koni')) {
        speak("Majhe creator aani developer Ruturaj ahet! Tyannich mala ya 3D avatar madhe banavla ahe! 💜");
      } else {
        speak(`Mi aikle: "${q}". Maze dole aani lips bagha, mi live boltey!`);
      }
    }

    sendBtn.addEventListener('click', handleUserInput);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleUserInput();
    });

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.onresult = (e) => { userInput.value = e.results[0][0].transcript; handleUserInput(); };
      micBtn.addEventListener('click', () => { dialogueText.innerText = "Mi aiktay, bola..."; rec.start(); });
    }
  </script>
</body>
</html>
